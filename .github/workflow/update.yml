name: update-data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch previous-close data
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, datetime, time
          from pathlib import Path

          tickers = json.loads(Path("tickers.json").read_text(encoding="utf-8"))
          out = {"_updated": datetime.datetime.now(datetime.timezone.utc).astimezone(datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y-%m-%d %H:%M")}

          def fetch(symbol):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range=10d&interval=1d"
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          for code, fallback_name in tickers.items():
              if not (isinstance(code,str) and len(code)==6 and code.isdigit()):
                  continue
              found = None
              for suffix in (".KS",".KQ"):
                  try:
                      j=fetch(code+suffix)
                      res=j["chart"]["result"][0]
                      ts=res.get("timestamp") or []
                      q=res["indicators"]["quote"][0]
                      closes=q.get("close") or []
                      pairs=[(t,c) for t,c in zip(ts,closes) if c is not None]
                      if pairs:
                          found=pairs[-1][1]
                          break
                  except Exception:
                      pass
              if found is not None:
                  out[code]={"name":fallback_name,"price":found}
              else:
                  # Keep an existing value if this run cannot fetch it.
                  old={}
                  p=Path("prices.json")
                  if p.exists():
                      try: old=json.loads(p.read_text(encoding="utf-8"))
                      except Exception: pass
                  if code in old:
                      out[code]=old[code]
                  else:
                      out[code]={"name":fallback_name,"price":None}
              time.sleep(0.3)

          Path("prices.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update daily data"
          git push
