name: Update prices

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prices.json
        env:
          TZ: Asia/Seoul
        run: |
          python - <<'PY'
          import json, datetime, time, urllib.request, re
          from pathlib import Path

          tickers = json.loads(Path("tickers.json").read_text())["tickers"]
          prices = {}

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "ignore")

          for code in tickers:
              # Naver Finance page: name + previous/closing price.
              html = get(f"https://finance.naver.com/item/main.naver?code={code}")
              m = re.search(r'<h2[^>]*>\s*<a[^>]*>(.*?)</a>', html, re.S)
              name = re.sub(r'<.*?>','',m.group(1)).strip() if m else code

              # Try several patterns because page markup can change.
              close = None
              patterns = [
                  r'<th[^>]*>\s*전일\s*</th>\s*<td[^>]*>.*?<span[^>]*>([0-9,]+)</span>',
                  r'<th[^>]*>\s*종가\s*</th>\s*<td[^>]*>.*?<span[^>]*>([0-9,]+)</span>'
              ]
              for p in patterns:
                  mm = re.search(p, html, re.S)
                  if mm:
                      close = int(mm.group(1).replace(',',''))
                      break
              if close is not None:
                  prices[code] = {"name":name,"close":close}
              else:
                  print("FAIL", code, name)
              time.sleep(0.5)

          if not prices:
              raise SystemExit("No prices retrieved")

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          data = {
              "asof": now.strftime("%Y-%m-%d"),
              "updated_at": now.strftime("%Y-%m-%d %H:%M KST"),
              "prices": prices
          }
          Path("prices.json").write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update daily prices"
          git push
