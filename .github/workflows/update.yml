name: update-data

on:
  workflow_dispatch:
  schedule:
    # KST 매일 아침 06:00 (UTC 21:00 전날) — 매일 실행
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch KRX daily prices
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import datetime as dt
          import urllib.request
          from pathlib import Path

          auth = os.environ.get("KRX_AUTH_KEY", "").strip()
          if not auth:
              raise SystemExit("KRX_AUTH_KEY secret is missing.")

          tickers = json.loads(Path("tickers.json").read_text(encoding="utf-8"))
          if not isinstance(tickers, dict):
              raise SystemExit("tickers.json must be a JSON object.")

          wanted = {}
          for code, fallback_name in tickers.items():
              code = str(code).strip().upper()
              if len(code) == 6 and code.isalnum():
                  wanted[code] = str(fallback_name or "")

          if not wanted:
              raise SystemExit("No valid 6-character ticker codes.")

          # KRX Open API endpoints
          endpoints = [
              ("KOSPI", "https://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd"),
              ("KOSDAQ", "https://data-dbg.krx.co.kr/svc/apis/sto/ksq_bydd_trd"),
              ("ETF", "https://data-dbg.krx.co.kr/svc/apis/etp/etf_bydd_trd"),
          ]

          def number(v):
              if v is None:
                  return None
              s = str(v).replace(",", "").strip()
              if not s or s in ("-", "—"):
                  return None
              try:
                  return float(s) if "." in s else int(s)
              except ValueError:
                  return None

          def fetch(endpoint, date):
              req = urllib.request.Request(
                  endpoint + "?basDd=" + date,
                  headers={
                      "AUTH_KEY": auth,
                      "Accept": "application/json",
                      "User-Agent": "Mozilla/5.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          remaining = set(wanted)
          found = {}
          fetch_errors = 0

          # 한국 시간(KST) 기준 오늘 — GitHub Actions는 UTC로 실행되므로
          # KST 06:00(UTC 21:00 전날) 실행 시 UTC today는 이틀 전이 됨.
          # 반드시 KST today를 기준으로 lookback해야 최근 거래일 종가를 가져옴.
          kst = dt.timezone(dt.timedelta(hours=9))
          today = dt.datetime.now(kst).date()

          # 최근 거래일 종가를 찾을 때까지 최대 10일 lookback.
          # 단, 장이 열리지 않은 날(주말/공휴일)은 해당 날짜 데이터가 없으므로
          # 데이터가 비어있으면 다음 날로 넘어감.
          for n in range(10):
              if not remaining:
                  break
              date = (today - dt.timedelta(days=n)).strftime("%Y%m%d")

              any_data = False
              for market, endpoint in endpoints:
                  try:
                      data = fetch(endpoint, date)
                      rows = data.get("OutBlock_1", [])
                      if isinstance(rows, dict):
                          rows = [rows]

                      for row in rows:
                          any_data = True
                          code = str(row.get("ISU_CD", "")).strip().upper()
                          if code not in remaining:
                              continue

                          price = number(row.get("TDD_CLSPRC"))
                          if price is None:
                              continue

                          found[code] = {
                              "name": str(row.get("ISU_NM", "")).strip() or wanted[code],
                              "price": price,
                              "date": row.get("BAS_DD", date),
                              "market": market
                          }
                          remaining.remove(code)

                  except Exception as e:
                      fetch_errors += 1
                      print(f"{market} {date}: {e}")

              print(f"Lookback {n}: date={date} remaining={len(remaining)} errors={fetch_errors}")

          # 핵심: KRX에서 새 종가를 하나도 못 찾았으면 갱신 실패로 처리
          # (이전 데이터 그대로 _updated만 바꾸는 것 방지)
          if not found:
              raise SystemExit(
                  f"No prices fetched from KRX ({fetch_errors} errors). "
                  "prices.json not updated — check KRX_AUTH_KEY and API status."
              )

          old = {}
          old_path = Path("prices.json")
          if old_path.exists():
              try:
                  old = json.loads(old_path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          now = dt.datetime.now(kst)

          out = {"_updated": now.strftime("%Y-%m-%d %H:%M")}

          for code, fallback_name in wanted.items():
              if code in found:
                  out[code] = found[code]
              elif code in old:
                  out[code] = old[code]
              else:
                  out[code] = {
                      "name": fallback_name,
                      "price": None,
                      "date": None,
                      "market": None
                  }

          Path("prices.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Found {len(found)} / {len(wanted)} tickers.")
          if remaining:
              print("Not found:", ", ".join(sorted(remaining)))
          PY

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update KRX daily prices"
          git push
