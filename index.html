<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;color:#222}
h1{font-size:24px;margin-bottom:6px}.sub{color:#777;font-size:13px;margin-bottom:20px}
form{display:flex;gap:8px;margin:16px 0}input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{padding:10px 14px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #eee}th{text-align:left;color:#666;font-size:13px}.num{text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:#888;margin-top:14px}.err{color:#b00020}
</style>
</head>
<body>
<h1>Daily</h1>
<div class="sub" id="asof">데이터 불러오는 중…</div>
<form id="form">
  <input id="ticker" inputmode="numeric" maxlength="6" placeholder="종목번호 6자리 (예: 005930)">
  <button>추가</button>
</form>
<table><thead><tr><th>종목</th><th class="num">전 거래일 종가</th></tr></thead>
<tbody id="rows"></tbody></table>
<div class="small">종목번호는 6자리 숫자를 입력하세요. 추가한 종목은 이 브라우저에만 저장됩니다.</div>
<script>
const KEY='daily_tickers_v1';
let data={"asof":"","updated_at":"","prices":{}};

function getLocal(){
  try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e){ return []; }
}
function setLocal(a){localStorage.setItem(KEY,JSON.stringify(a));}

async function load(){
  render();
}
async function fetchImmediate(code){
  const symbol=code + '.KS';
  const urls=[
    'https://query1.finance.yahoo.com/v8/finance/chart/'+symbol+'?range=5d&interval=1d',
    'https://query2.finance.yahoo.com/v8/finance/chart/'+symbol+'?range=5d&interval=1d'
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) continue;
      const j=await r.json();
      const q=j?.chart?.result?.[0];
      const ts=q?.timestamp||[], c=q?.indicators?.quote?.[0]?.close||[];
      let i=c.length-1;
      while(i>=0 && (c[i]==null || !ts[i])) i--;
      if(i>=0){
        // Yahoo's latest daily candle is normally the latest trading day.
        // For an in-session day, use the previous completed daily candle.
        const todayKst=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
        const d=new Date(ts[i]*1000);
        const dateKst=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
        let chosen=i;
        if(dateKst===todayKst && i>0) chosen=i-1;
        const close=c[chosen];
        const name=q.meta?.longName || q.meta?.shortName || code;
        data.prices=data.prices||{};
        data.prices[code]={name,close:Math.round(close)};
        data.asof=dateKst;
        render();
        return true;
      }
    }catch(e){}
  }
  return false;
}

function render(){
  const symbols=getLocal().length?getLocal():Object.keys(data.prices||{});
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  symbols.forEach(s=>{
    const x=data.prices?.[s];
    const tr=document.createElement('tr');
    const name=x?.name || s;
    const close=x?.close;
    tr.innerHTML='<td>'+escapeHtml(name)+' <span style="color:#999;font-size:12px">('+s+')</span></td>'+
      '<td class="num">'+(close==null?'—':Number(close).toLocaleString('ko-KR')+'원')+'</td>';
    rows.appendChild(tr);
  });
  document.getElementById('asof').textContent=
    data.asof ? ('기준일: '+data.asof+' · 마지막 자동갱신: '+(data.updated_at||'')) : '데이터 준비 중';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault();
  const s=document.getElementById('ticker').value.trim();
  if(!/^\d{6}$/.test(s)){alert('6자리 종목번호를 입력하세요.');return;}
  const a=getLocal(); if(!a.includes(s)) a.push(s); setLocal(a);
  document.getElementById('ticker').value='';
  render();
  const ok=await fetchImmediate(s);
  if(!ok) alert('즉시 조회에 실패했습니다. 다음 자동 갱신 때 다시 시도합니다.');
});
load();
</script>
</body>
</html>
