<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:32px auto;padding:0 18px;color:#222}
h1{font-size:24px;margin-bottom:8px}.sub{color:#666;font-size:14px}
.form{display:flex;gap:8px;margin:22px 0}.form input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:13px 8px;border-bottom:1px solid #eee}
th{text-align:left;color:#666;font-size:13px}.num{text-align:right}
.msg{min-height:22px;color:#666;font-size:14px}.error{color:#b00020}.small{font-size:12px;color:#888;margin-top:16px}
</style>
</head>
<body>
<h1>Daily</h1>
<div class="sub">전 거래일 종가</div>
<div class="form">
<input id="ticker" inputmode="text" autocapitalize="characters" maxlength="6"
placeholder="종목번호 6자리 (예: 005930 / 0064K0)">
<button id="add">추가</button>
</div>
<div id="msg" class="msg"></div>
<table>
<thead><tr><th>종목</th><th class="num">전 거래일 종가</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div id="updated" class="small"></div>
<script>
const DATA_URL="./prices.json";
const KEY="daily_tickers_v3";
let data={};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function normalizeTicker(x){return String(x).trim().toUpperCase().replace(/\s/g,"");}

function getTickers(){
  try{
    const a=JSON.parse(localStorage.getItem(KEY)||"[]");
    return [...new Set(a.map(normalizeTicker).filter(x=>/^[A-Z0-9]{6}$/.test(x)))];
  }catch(e){return [];}
}
function saveTickers(a){localStorage.setItem(KEY,JSON.stringify(a));}

function render(){
  const rows=document.getElementById("rows"), list=getTickers();
  rows.innerHTML="";
  if(!list.length){
    rows.innerHTML='<tr><td colspan="3" style="color:#888">종목번호를 입력해 추가하세요.</td></tr>';
    return;
  }
  for(const t of list){
    const d=data[t];
    const name=d?.name||"등록된 종목";
    const price=d?.price==null?"-":Number(d.price).toLocaleString("ko-KR")+"원";
    const date=d?.date||"", market=d?.market||"";
    rows.insertAdjacentHTML("beforeend",
      `<tr><td>${esc(name)}<div style="font-size:12px;color:#999">${esc(t)}${market?" · "+esc(market):""}${date?" · "+esc(date):""}</div></td>
      <td class="num">${price}</td>
      <td class="num"><button style="padding:7px 9px;font-size:12px" onclick="removeTicker('${esc(t)}')">삭제</button></td></tr>`);
  }
}
function removeTicker(t){saveTickers(getTickers().filter(x=>x!==t));render();}

async function load(){
  const msg=document.getElementById("msg");
  try{
    const r=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    data=await r.json();
    document.getElementById("updated").textContent=data._updated?"데이터 갱신: "+data._updated:"";
    render();msg.textContent="";msg.className="msg";
  }catch(e){
    data={};render();
    msg.textContent="종가 데이터 파일을 불러오지 못했습니다.";
    msg.className="msg error";
  }
}

function addTicker(){
  const input=document.getElementById("ticker"), t=normalizeTicker(input.value);
  const msg=document.getElementById("msg");
  if(!/^[A-Z0-9]{6}$/.test(t)){
    msg.textContent="6자리 종목번호를 입력하세요. 예: 005930 또는 0064K0";
    msg.className="msg error";return;
  }
  const list=getTickers();
  if(!list.includes(t)){list.push(t);saveTickers(list);}
  msg.textContent=data[t]?data[t].name+"을(를) 추가했습니다.":"등록했습니다. 데이터가 아직 없으면 다음 자동 갱신 후 표시됩니다.";
  msg.className="msg";input.value="";render();
}
document.getElementById("add").addEventListener("click",addTicker);
document.getElementById("ticker").addEventListener("keydown",e=>{if(e.key==="Enter")addTicker();});
load();
</script>
</body>
</html>
